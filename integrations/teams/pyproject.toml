[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xperfect-teams"
version = "0.1.0"
description = "Microsoft Teams channel for xPerfect Experts"
requires-python = ">=3.11"
dependencies = ["microsoft-teams-apps==2.2.1", "httpx>=0.28,<1.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["xperfect_teams*"]
