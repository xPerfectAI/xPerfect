# Publish an exact, already tested package image pair to this repository's container packages.
# A maintainer stages the pair as an OCI archive on a draft release; the committed manifest names
# that release, the archive's SHA-256 and each image's digest. The copy preserves every digest,
# so the published references are the images that were tested.
name: Publish candidate package images

on:
  # Maintainers can publish the same digest-checked archive without creating a branch.
  workflow_dispatch:
  push:
    branches: ['candidate/**']
    paths:
      - .github/workflows/publish-candidate-images.yml
      - deployment/linux/candidate-images.json

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write  # read the maintainer's draft staging release; drafts need write access
      packages: write  # push to this repository's container packages
    env:
      SKOPEO: quay.io/skopeo/stable@sha256:24940638e4abb0edfedc78a680554f316069d0212a00159276759421a059e611
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read the manifest of this commit
        run: |
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$GITHUB_REPOSITORY/contents/deployment/linux/candidate-images.json?ref=$GITHUB_SHA" \
            > "$RUNNER_TEMP/candidate-images.json"
          jq -e '.images | length > 0' "$RUNNER_TEMP/candidate-images.json"
      - name: Download and verify the staged archive
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          manifest = json.loads((root / 'candidate-images.json').read_text())
          def safe_name(value):
              if not isinstance(value, str) or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]{0,127}', value):
                  raise ValueError('Invalid archive asset name')
              return value
          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          def download(name):
              subprocess.run(['gh', 'release', 'download', manifest['staging_release'],
                  '--repo', os.environ['GITHUB_REPOSITORY'], '--pattern', safe_name(name),
                  '--dir', str(root)], check=True)
          archive = root / safe_name(manifest['archive'])
          parts = manifest.get('archive_parts')
          if parts is None:
              download(archive.name)
          else:
              if not isinstance(parts, list) or not 1 <= len(parts) <= 16:
                  raise ValueError('Invalid archive part count')
              names = [safe_name(part['name']) for part in parts]
              if len(set(names)) != len(names) or archive.name in names:
                  raise ValueError('Archive parts must have distinct names')
              with archive.open('xb') as output:
                  for part in parts:
                      download(part['name'])
                      path = root / part['name']
                      if digest(path) != part['sha256']:
                          raise ValueError('Archive part digest mismatch')
                      with path.open('rb') as stream:
                          shutil.copyfileobj(stream, output)
                      path.unlink()
          if digest(archive) != manifest['archive_sha256']:
              raise ValueError('Staged archive digest mismatch')
          print('Verified complete OCI archive')
          PY
      - name: Copy each image by exact digest and verify it
        run: |
          manifest="$RUNNER_TEMP/candidate-images.json"
          archive="$(jq -r .archive "$manifest")"
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          jq -c '.images[]' "$manifest" | while read -r image; do
            destination="ghcr.io/$owner/$(jq -r .repository <<<"$image")"
            digest="$(jq -r .digest <<<"$image")"
            platform="$(jq -r '.platform // empty' <<<"$image")"
            printf '%s' "$GH_TOKEN" | docker run --rm -i --entrypoint sh -v "$RUNNER_TEMP:/work" "$SKOPEO" -c '
              skopeo login --username "$0" --password-stdin ghcr.io >/dev/null &&
              skopeo copy --quiet --all --preserve-digests --retry-times 3 "oci-archive:/work/$1:$2" "docker://$3:$4" &&
              skopeo inspect --raw "docker://$3@$5" | sha256sum | cut -d" " -f1 > /work/published.sha &&
              if test -n "$6"; then skopeo inspect --config "docker://$3@$5" > /work/published-config.json; fi' \
              "$GITHUB_ACTOR" "$archive" "$(jq -r .archive_ref <<<"$image")" "$destination" \
              "$(jq -r .tag <<<"$image")" "$digest" "$platform"
            test "sha256:$(cat "$RUNNER_TEMP/published.sha")" = "$digest"
            if test -n "$platform"; then
              jq -e --arg platform "$platform" '.os + "/" + .architecture == $platform' "$RUNNER_TEMP/published-config.json" >/dev/null
            fi
            echo "Published $destination@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Report package visibility
        run: |
          for name in $(jq -r '.images[].repository' "$RUNNER_TEMP/candidate-images.json"); do
            visibility="$(gh api "orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$name" \
              --jq '.visibility + " (repository: " + (.repository.full_name // "none") + ")"' 2>&1 || true)"
            echo "$name: $visibility" | tee -a "$GITHUB_STEP_SUMMARY"
          done
