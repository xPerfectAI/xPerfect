<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img" aria-labelledby="after-title after-desc" style="font-family:Arial,Helvetica,sans-serif"><title id="after-title">xPerfect — proposed architecture</title><desc id="after-desc">Applications use the same standalone runtime. Live work uses Queen and Direct or native workers. Context, accounts, sessions and durable storage are shared capabilities, not additional serial AI steps. The clock currently runs saved workers; the proposal adds a provider-free signed webhook target. Client interpretation moves outside the generic runtime.</desc><defs><marker id="after-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#738297"/></marker></defs><rect width="1200" height="1040" fill="#0d1119"/><rect x="24" y="16" width="1152" height="86" rx="12" fill="#101923" stroke="#57718e" stroke-dasharray="8 6"/><text x="44" y="46" fill="#afc9e3" font-size="17" font-weight="600">OUTSIDE xPERFECT · people and applications A…N</text><text x="44" y="76" fill="#e5edf6" font-size="19" font-weight="400">Standalone use · API / MCP clients · applications A…N · voice modules</text><rect x="24" y="132" width="1152" height="778" rx="14" fill="#10151e" stroke="#7383ac" stroke-dasharray="9 7"/><text x="44" y="165" fill="#c7d2f0" font-size="18" font-weight="600">xPERFECT · independent control plane, orchestrator, manager and harness runtime</text><text x="44" y="200" fill="#9eaec5" font-size="16" font-weight="600">LIVE WORK · one request, configured execution, streamed result</text><rect x="44" y="222" width="250" height="126" rx="12" fill="#151b25" stroke="#354154"/><text x="62" y="254" fill="#f4f6fb" font-size="21" font-weight="600">UI · API · MCP</text><text x="62" y="284" fill="#b8c1d0" font-size="17" font-weight="400">Authenticated request</text><text x="62" y="308" fill="#b8c1d0" font-size="17" font-weight="400">Scoped control and access</text><rect x="330" y="222" width="250" height="126" rx="12" fill="#151b25" stroke="#354154"/><text x="348" y="254" fill="#f4f6fb" font-size="21" font-weight="600">Queen / manager</text><text x="348" y="284" fill="#b8c1d0" font-size="17" font-weight="400">Answer or control work</text><text x="348" y="308" fill="#b8c1d0" font-size="17" font-weight="400">One owner per work item</text><rect x="616" y="222" width="250" height="126" rx="12" fill="#151b25" stroke="#354154"/><text x="634" y="254" fill="#f4f6fb" font-size="21" font-weight="600">Direct / native AI</text><text x="634" y="284" fill="#b8c1d0" font-size="17" font-weight="400">Configured model + effort</text><text x="634" y="308" fill="#b8c1d0" font-size="17" font-weight="400">Native workers A…N</text><rect x="902" y="222" width="250" height="126" rx="12" fill="#151b25" stroke="#354154"/><text x="920" y="254" fill="#f4f6fb" font-size="21" font-weight="600">Return the result</text><text x="920" y="284" fill="#b8c1d0" font-size="17" font-weight="400">Stream · files · events</text><text x="920" y="308" fill="#b8c1d0" font-size="17" font-weight="400">Exact work and receipts</text><path d="M294 285H330" fill="none" stroke="#738297" stroke-width="2" marker-end="url(#after-arrow)"/><path d="M580 285H616" fill="none" stroke="#738297" stroke-width="2" marker-end="url(#after-arrow)"/><path d="M866 285H902" fill="none" stroke="#738297" stroke-width="2" marker-end="url(#after-arrow)"/><path d="M740 348V365H455V348" fill="none" stroke="#738297" stroke-width="2" marker-end="url(#after-arrow)"/><path d="M169 102V132" fill="none" stroke="#738297" stroke-width="2" marker-end="url(#after-arrow)"/><text x="44" y="386" fill="#9eaec5" font-size="16" font-weight="600">SHARED CAPABILITIES · available to runs, not extra AI stages</text><rect x="44" y="408" width="250" height="126" rx="12" fill="#151b25" stroke="#354154"/><text x="62" y="440" fill="#f4f6fb" font-size="21" font-weight="600">Context · tools</text><text x="62" y="470" fill="#b8c1d0" font-size="17" font-weight="400">Original inputs and files</text><text x="62" y="494" fill="#b8c1d0" font-size="17" font-weight="400">Authorized tools + peers</text><rect x="330" y="408" width="250" height="126" rx="12" fill="#151b25" stroke="#354154"/><text x="348" y="440" fill="#f4f6fb" font-size="21" font-weight="600">Accounts · security</text><text x="348" y="470" fill="#b8c1d0" font-size="17" font-weight="400">Identity, grants and limits</text><text x="348" y="494" fill="#b8c1d0" font-size="17" font-weight="400">Provider / account routing</text><rect x="616" y="408" width="250" height="126" rx="12" fill="#151b25" stroke="#354154"/><text x="634" y="440" fill="#f4f6fb" font-size="21" font-weight="600">Sessions · controls</text><text x="634" y="470" fill="#b8c1d0" font-size="17" font-weight="400">Reuse and warm capacity</text><text x="634" y="494" fill="#b8c1d0" font-size="17" font-weight="400">Steer · pause · stop · retry</text><rect x="902" y="408" width="250" height="126" rx="12" fill="#151b25" stroke="#354154"/><text x="920" y="440" fill="#f4f6fb" font-size="21" font-weight="600">State · operations</text><text x="920" y="470" fill="#b8c1d0" font-size="17" font-weight="400">History, artifacts, recovery</text><text x="920" y="494" fill="#b8c1d0" font-size="17" font-weight="400">Events, install and packaging</text><text x="44" y="574" fill="#9eaec5" font-size="16" font-weight="600">SCHEDULED WORK · same clock, existing execution and delivery owners</text><rect x="44" y="596" width="300" height="126" rx="12" fill="#151b25" stroke="#354154"/><text x="62" y="628" fill="#f4f6fb" font-size="21" font-weight="600">Clock + recurrence</text><text x="62" y="658" fill="#b8c1d0" font-size="17" font-weight="400">Once · repeat · time zones</text><text x="62" y="682" fill="#b8c1d0" font-size="17" font-weight="400">Durable occurrence claim</text><rect x="438" y="596" width="300" height="126" rx="12" fill="#102725" stroke="#3f9d89"/><text x="456" y="628" fill="#f4f6fb" font-size="21" font-weight="600">Worker OR webhook</text><text x="456" y="658" fill="#b8c1d0" font-size="17" font-weight="400">Choose the typed target</text><text x="456" y="682" fill="#b8c1d0" font-size="17" font-weight="400">Keep current authority</text><rect x="830" y="596" width="322" height="126" rx="12" fill="#102725" stroke="#3f9d89"/><text x="848" y="628" fill="#f4f6fb" font-size="21" font-weight="600">Run or notify</text><text x="848" y="658" fill="#b8c1d0" font-size="17" font-weight="400">Worker → configured AI</text><text x="848" y="682" fill="#b8c1d0" font-size="17" font-weight="400">Webhook → durable outbox</text><path d="M344 659H438" fill="none" stroke="#738297" stroke-width="2" marker-end="url(#after-arrow)"/><path d="M738 659H830" fill="none" stroke="#738297" stroke-width="2" marker-end="url(#after-arrow)"/><rect x="44" y="758" width="300" height="114" rx="12" fill="#151b25" stroke="#354154"/><text x="62" y="790" fill="#f4f6fb" font-size="21" font-weight="600">Worker / run results</text><text x="62" y="820" fill="#b8c1d0" font-size="17" font-weight="400">Existing callback evidence</text><text x="62" y="844" fill="#b8c1d0" font-size="17" font-weight="400">Not another AI planning turn</text><rect x="438" y="758" width="300" height="114" rx="12" fill="#102725" stroke="#3f9d89"/><text x="456" y="790" fill="#f4f6fb" font-size="21" font-weight="600">One durable outbox</text><text x="456" y="820" fill="#b8c1d0" font-size="17" font-weight="400">Callbacks + signed due POST</text><text x="456" y="844" fill="#b8c1d0" font-size="17" font-weight="400">Bounded, persisted retries</text><rect x="830" y="758" width="322" height="114" rx="12" fill="#151b25" stroke="#354154"/><text x="848" y="790" fill="#f4f6fb" font-size="21" font-weight="600">Delivery state</text><text x="848" y="820" fill="#b8c1d0" font-size="17" font-weight="400">Accepted ≠ finished app work</text><text x="848" y="844" fill="#b8c1d0" font-size="17" font-weight="400">Return actual facts to clients</text><path d="M344 815H438" fill="none" stroke="#738297" stroke-width="2" marker-end="url(#after-arrow)"/><path d="M738 815H830" fill="none" stroke="#738297" stroke-width="2" marker-end="url(#after-arrow)"/><path d="M788 659V737H590V758" fill="none" stroke="#738297" stroke-width="2" marker-end="url(#after-arrow)"/><path d="M990 872V947" fill="none" stroke="#738297" stroke-width="2" marker-end="url(#after-arrow)"/><rect x="24" y="946" width="1152" height="76" rx="12" fill="#101923" stroke="#57718e" stroke-dasharray="8 6"/><text x="44" y="976" fill="#afc9e3" font-size="17" font-weight="600">OUTSIDE xPERFECT · the application receives and owns its next action</text><text x="44" y="1005" fill="#e5edf6" font-size="18" font-weight="400">Existing worker callbacks · new signed schedule.due POST to any configured receiver</text></svg>